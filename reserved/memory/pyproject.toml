[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dounai-memory-reserved"
version = "0.1.0"
description = "Dounai 记忆扩展插件（Reserved · 契约桩，禁止真实记忆管线）"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[tool.setuptools]
packages = ["dounai_memory_reserved"]
