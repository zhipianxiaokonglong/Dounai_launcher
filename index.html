<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dounai 启动器</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <!--
      骨架按 M4 设计稿：左侧栏 232px ＋ 页头 60px ＋ 内容区 ＋ 状态栏 30px。
      窗口用系统标题栏（tauri.conf.json 未关 decorations），所以这里不画假的
      窗口按钮——装饰是平台的事，自绘会丢掉贴边、双击最大化与无障碍语义。
    -->
    <div class="app">
      <div class="body">
        <aside class="rail">
          <div class="brand">
            <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3l9 9-9 9-9-9z"/></svg></span>
            <div class="brand__text">
              <b>Dounai</b>
              <span id="brand-version">launcher</span>
            </div>
          </div>

          <nav class="nav" id="nav" aria-label="主导航">
            <button class="nav-item" type="button" data-view="modules">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg></span>模块
              <span class="nav-count" id="nav-count-modules"></span>
            </button>
            <button class="nav-item" type="button" data-view="env">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg></span>环境
              <span class="nav-count" id="nav-count-env"></span>
            </button>
            <button class="nav-item" type="button" data-view="logs">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 6h14M5 12h14M5 18h9"/></svg></span>日志
              <span class="nav-count" id="nav-count-logs"></span>
            </button>
            <div class="nav-label">系统</div>
            <button class="nav-item" type="button" data-view="settings">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg></span>设置
            </button>
            <button class="nav-item" type="button" data-view="import">
              <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3.5v10m0 0l-4-4m4 4l4-4"/><path d="M4 15.5v4h16v-4"/></svg></span>导入本地
            </button>
          </nav>

          <div class="rail-foot" id="rail-foot"></div>
        </aside>

        <main class="main">
          <div class="phead" id="phead"></div>
          <div class="pbody" id="pbody"></div>
        </main>
      </div>

      <footer class="sbar" id="sbar"></footer>
    </div>

    <!-- 模态与向导都挂在这里，避免各视图各自持有一份遮罩 -->
    <div id="overlay" hidden></div>

    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

    <script type="module" src="./src/ui/main.ts"></script>
  </body>
</html>
