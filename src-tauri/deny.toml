# cargo-deny 配置（供应链卫生）
#
# 目的：
#  - advisories：拒绝已知漏洞与 yanked 依赖；
#  - bans：禁止重复依赖与特定不受欢迎的 crate。

[advisories]
# 有漏洞的依赖直接失败，不允许"仅警告"
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"       # 依赖里不允许写 "*"
deny = []

[licenses]
# 允许的许可证（本项目 GPL-3.0-or-later，需兼容）
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8

[sources]
# 只允许来自 crates.io 的依赖，禁止 git 与本地路径依赖混入发布
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
