# cargo-deny 配置（供应链卫生）
#
# 目的：
#  - advisories：拒绝已知漏洞与 yanked 依赖；
#  - bans：禁止重复依赖与特定不受欢迎的 crate。

[advisories]
# cargo-deny 0.16+ 已移除 vulnerability/unmaintained/unsound/notice 字段，
# 所有漏洞类 advisory 默认即失败；这里只配置「unmaintained/unsound 的生效范围」。
# unmaintained = "workspace"：仅直接依赖的 unmaintained 会失败，
#   传递依赖（Linux/D-Bus 平台的 proc-macro-error/zbus_names/zvariant/glib 等）不阻断。
# 个别需要放行的 advisory 用 ignore 字段显式列出。
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"       # 依赖里不允许写 "*"
deny = []

[licenses]
# 允许的许可证（本项目 GPL-3.0-or-later，需兼容）
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8

[sources]
# 只允许来自 crates.io 的依赖，禁止 git 与本地路径依赖混入发布
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
