[workspace]
members = ["core"]

[package]
name = "dounai-launcher"
version = "0.4.0"
description = "Dounai launcher: install, environment and module management"
edition = "2021"
license = "GPL-3.0-or-later"
# 同一个 crate 里还有 pack / sign_catalog 两个发布工具，`cargo run` 会因多目标
# 而拒绝执行；`tauri dev` 依赖无歧义的默认目标。
default-run = "dounai-launcher"

[features]
# 生产构建必须带这个 feature：`generate_context!` 在编译期决定是内嵌 `../dist`
# 还是加载 `devUrl`。缺了它，`cargo build --release` 也能编译通过，但产物会去连
# `http://localhost:5175`，窗口里只有 Edge 的 ERR_CONNECTION_REFUSED。
# `cargo tauri build` 会自动加；直接调 cargo 时必须手动带 `--features custom-protocol`。
# `default` 里带 tray：默认关闭行为是「收进托盘」，没有托盘图标用户就找不回窗口。
default = ["tray"]
# 系统托盘：关窗收进托盘、托盘菜单「显示主窗口 / 退出」都要它。
# `image-png` 用来解码内嵌的 PNG 图标。
tray = ["tauri/tray-icon", "tauri/image-png"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "dounai_launcher"
path = "src/lib.rs"

[[bin]]
name = "dounai-launcher"
path = "src/main.rs"

[dependencies]
launcher-core = { path = "core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
walkdir = "2"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
base64 = "0.23.1"
tauri = { version = "=2.12.5", features = ["unstable"] }
tauri-plugin-single-instance = "2.5.4"
# 只为「导入本地包」用系统文件选择器：不放开 fs 插件，路径拿到后由 Rust 读文件。
tauri-plugin-dialog = "2.8.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy", "socks"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
zip = { version = "9", features = ["deflate"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
