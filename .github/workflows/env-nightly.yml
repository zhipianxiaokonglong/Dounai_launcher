name: env-nightly

# 真 uv 集成测试要下载托管 Python 与 wheels，只在夜间或手动触发。
# 每次 PR 的 mock 单测在 ci.yml 的 core job 里跑。
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-uv:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Fetch pinned uv 0.13.7
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/uv.zip"
          $bin = "$env:RUNNER_TEMP/uv-bin"
          $url = "https://github.com/astral-sh/uv/releases/download/0.13.7/uv-x86_64-pc-windows-msvc.zip"
          # 哈希取自 2026-11-10 从同一 URL 下载的 release 资产，与 bootstrap.rs 的固定 URL 一致。
          $expected = "0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "uv.zip 的 sha256 不符：$actual" }
          Expand-Archive -Path $zip -DestinationPath $bin -Force
          # 0.13.7 资产把 uv.exe 放在根目录；递归定位以兼容将来加一层目录。
          $uv = Get-ChildItem $bin -Recurse -Filter uv.exe | Select-Object -First 1
          if (-not $uv) { throw "解压后找不到 uv.exe" }
          "DOUNAI_TEST_UV=$($uv.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Real uv integration (ignored test)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $out = cargo test -p launcher-core --test env_engine -- --ignored --exact real_uv_prepares_venv_without_touching_source --nocapture | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "真 uv 集成测试失败" }
          # --exact 匹配不到任何测试时 libtest 仍返回 0，显式确认确实跑了一条。
          if ($out -notmatch "1 passed") { throw "真 uv 集成测试没有被执行" }
